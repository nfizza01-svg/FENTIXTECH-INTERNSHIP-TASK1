<!DOCTYPE html>
<html>
<head>
    <title>Wireframe Layout</title>
</head>
<body bgcolor="#ffffff">
    <table width="100%" height="800" border="0" cellpadding="0" cellspacing="15">
        <!-- Header -->
        <tr height="80">
            <td colspan="3" bgcolor="#edf1f5" align="center" valign="middle">
                <font face="Arial, sans-serif" size="4">Header</font>
            </td>
        </tr>
        
        <!-- Navigation Menu -->
        <tr height="60">
            <td colspan="3" bgcolor="#edf1f5" align="center" valign="middle">
                <font face="Arial, sans-serif" size="3">Navigation Menu</font>
            </td>
        </tr>
        
        <!-- Main Body -->
        <tr>
            <td width="20%" bgcolor="#edf1f5" align="center" valign="middle">
                <font face="Arial, sans-serif" size="3">Content</font>
            </td>
            <td width="60%" bgcolor="#edf1f5" align="center" valign="middle">
                <font face="Arial, sans-serif" size="3">Main Content</font>
            </td>
            <td width="20%" bgcolor="#edf1f5" align="center" valign="middle">
                <font face="Arial, sans-serif" size="3">Content</font>
            </td>
        </tr>
        
        <!-- Footer -->
        <tr height="80">
            <td colspan="3" bgcolor="#edf1f5" align="center" valign="middle">
                <font face="Arial, sans-serif" size="3">Footer</font>
            </td>
        </tr>
    </table>
</body>
</html>
